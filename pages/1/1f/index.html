<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turn off the switch - minmang</title>

    <!-- 구글 폰트 'Slackey' 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Slackey&display=swap"
      rel="stylesheet"
    />

    <!-- 스타일 파일 연결 (pages/1/1f/ 기준 → 최상위까지 3칸: ../../../) -->
    <link rel="stylesheet" href="../../../style/main.css" />
    <link rel="stylesheet" href="style/1f.css" />
  </head>
  <body>
    <main class="floor-wrapper">
      <!-- 🟢 왼쪽 연두색 영역 -->
      <section class="left-side">
        <!-- 뒤로가기 화살표 버튼 -->
        <a href="../../../index.html" class="back-btn">&#8592;</a>

        <!-- 왼쪽 메인 일러스트 -->
        <img
          id="mainIllustration"
          src="../../../images/화장실2.webp"
          alt="화장실 상황"
          class="main-img"
        />
      </section>

      <!-- 🔴 오른쪽 핑크색 영역 -->
      <section class="right-side">
        <h1 class="title">Turn off<br />the<br />switch</h1>

        <p class="desc">
          거울을 가까이 대고 보다가 코끝에서 삐져나온 민망한 코털을 발견한 상황,
          방금 대화하던 상대가 내 코만 뚫어져라 주시하고 있었던 것만 같은
          상황이다. 근데 과연 진짜 그럴까?
        </p>

        <!-- 스위치 위치 고정용 박스 -->
        <div class="switch-box">
          <img
            id="switchButton"
            src="../../../images/스위치오프.svg"
            alt="스위치"
            class="switch-img"
          />
        </div>

        <!-- 🔗 Survival Tips (삐져나온 코털) -->
        <a
          href="../../../pages2/survival/index.html?category=nosehair"
          class="next-tip"
          >Survival Tips &rarr;</a
        >
      </section>
    </main>

    <!-- 스위치 온오프 및 일러스트 변경 자바스크립트 -->
    <script>
      const switchBtn = document.getElementById("switchButton");
      const mainImg = document.getElementById("mainIllustration");

      let isSwitched = false;

      switchBtn.addEventListener("click", () => {
        isSwitched = !isSwitched;

        if (isSwitched) {
          mainImg.src = "../../../images/화장실원본.webp";
          switchBtn.src = "../../../images/스위치온.svg";
        } else {
          mainImg.src = "../../../images/화장실2.webp";
          switchBtn.src = "../../../images/스위치오프.svg";
        }
      });
    </script>
  </body>
</html>
